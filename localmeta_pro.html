<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalMeta Pro — Локальный инспектор и очиститель метаданных</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --hover: #334155;
    --text: #f8fafc; --muted: #94a3b8; --blue: #3b82f6;
    --red: #ef4444; --green: #10b981; --border: #334155;
  }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { background: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; justify-content: center; }
  .wrap { max-width: 1080px; width: 100%; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 18px; }
  .badge { background: rgba(16,185,129,0.15); color: var(--green); padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
  .drop { border: 2px dashed var(--border); border-radius: 12px; padding: 36px 16px; text-align: center; background: var(--card); cursor: pointer; transition: 0.2s; }
  .drop:hover, .drop.drag { border-color: var(--blue); background: var(--hover); }
  .grid { display: none; grid-template-columns: 310px 1fr; gap: 18px; margin-top: 18px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .row { display: grid; grid-template-columns: 190px 1fr 34px; gap: 8px; margin-bottom: 8px; align-items: center; }
  input, textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; width: 100%; font-size: 13px; }
  textarea { min-height: 140px; font-family: monospace; resize: vertical; }
  button { cursor: pointer; border: none; border-radius: 6px; padding: 10px 14px; font-weight: 600; }
  .btn-blue { background: var(--blue); color: #fff; width: 100%; margin-top: 10px; }
  .btn-red { background: var(--red); color: #fff; width: 100%; margin-top: 10px; }
  .btn-green { background: var(--green); color: #fff; width: 100%; margin-top: 10px; }
  .btn-del { background: rgba(239,68,68,0.2); color: var(--red); padding: 8px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 10px; flex-wrap: wrap; }
  .tab { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; font-size: 13px; }
  .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .note { background: rgba(245,158,11,0.15); border-left: 4px solid #f59e0b; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; border-radius: 4px; line-height: 1.4; }
  .prev img { max-width: 100%; max-height: 200px; object-fit: contain; border-radius: 6px; margin-top: 10px; border: 1px solid var(--border); background: #000; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; z-index: 99; }
  .modal-box { background: var(--card); padding: 24px; border-radius: 10px; max-width: 380px; width: 90%; border: 1px solid var(--border); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h2 style="margin:0;">LocalMeta Pro</h2>
      <small style="color:var(--muted)">JPEG • PNG • WebP • TIFF • C2PA/AI • PDF • Office (100% локально)</small>
    </div>
    <div class="badge" id="statusBadge">🔒 Автономный движок готов</div>
  </header>

  <div class="drop" id="drop">
    <h3 style="margin-top:0;">Перетащите один или несколько файлов сюда</h3>
    <p style="color:var(--muted); margin-bottom:0; font-size:13px;">
      1 файл — детальный редактор метаданных. 2 и более файлов — пакетная очистка в ZIP.
    </p>
    <input type="file" id="inp" multiple hidden>
  </div>

  <div class="box" id="batchBox" style="display:none; margin-top:18px;">
    <h3 style="margin-top:0;">Пакетная очистка файлов</h3>
    <div id="batchLog" style="font-size:13px; color:var(--muted); line-height:1.7; max-height:260px; overflow-y:auto;"></div>
    <button class="btn-green" id="batchDownload" style="display:none;">📦 Скачать очищенный ZIP-архив</button>
  </div>

  <div class="grid" id="work">
    <div class="box">
      <h4 style="margin-top:0;">Информация о файле</h4>
      <div id="info" style="font-size:13px; color:var(--muted); line-height:1.6;"></div>
      <div class="prev" id="prev" style="margin-top:12px;"></div>
      <button class="btn-red" id="purge">🧹 Удалить ВСЕ метаданные</button>
      <button class="btn-blue" id="save">💾 Скачать готовый файл</button>
    </div>
    <div class="box">
      <div class="tabs" id="tabs"></div>
      <div id="banner"></div>
      <div id="fields"></div>
      <button class="tab" id="add" style="margin-top:12px;">+ Добавить поле</button>
    </div>
  </div>
</div>

<script>
const S = {
  file: null,
  buf: null,
  ext: "",
  tab: "gen",
  meta: { gen: {}, c2pa: null, sig: [], emb: [] },
  raw: {},
  batchZip: null
};

const $ = (id) => document.getElementById(id);

$("drop").onclick = () => $("inp").click();
$("drop").ondragover = (e) => { e.preventDefault(); $("drop").classList.add("drag"); };
$("drop").ondragleave = () => $("drop").classList.remove("drag");
$("drop").ondrop = (e) => {
  e.preventDefault();
  $("drop").classList.remove("drag");
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
    routeFiles(e.dataTransfer.files);
  }
};
$("inp").onchange = (e) => {
  if (e.target && e.target.files && e.target.files.length) {
    routeFiles(e.target.files);
  }
};

function routeFiles(fileList) {
  if (fileList.length === 1) {
    $("batchBox").style.display = "none";
    handleSingleFile(fileList[0]);
  } else {
    $("work").style.display = "none";
    handleBatchFiles(fileList);
  }
}

async function handleBatchFiles(fileList) {
  $("batchBox").style.display = "block";
  $("batchDownload").style.display = "none";
  $("batchLog").innerHTML = `Обработка ${fileList.length} файлов...<br>`;
  const zipEntries = [];

  for (let i = 0; i < fileList.length; i++) {
    const f = fileList[i];
    try {
      const cleanBlob = await quickCleanFile(f);
      const arr = new Uint8Array(await cleanBlob.arrayBuffer());
      zipEntries.push({ name: "clean_" + f.name, data: arr });
      $("batchLog").innerHTML += `✅ ${esc(f.name)} — очищен<br>`;
    } catch (err) {
      $("batchLog").innerHTML += `❌ ${esc(f.name)} — ошибка: ${esc(err.message)}<br>`;
    }
  }
  S.batchZip = buildSimpleZip(zipEntries);
  $("batchDownload").style.display = "block";
}

$("batchDownload").onclick = () => {
  if (!S.batchZip) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(S.batchZip);
  a.download = "cleaned_files.zip";
  a.click();
};

async function quickCleanFile(file) {
  const buf = await file.arrayBuffer();
  const ext = file.name.split(".").pop().toLowerCase();
  const bytes = new Uint8Array(buf);
  let blob;

  if (["jpg", "jpeg"].includes(ext)) {
    blob = cleanJpegLossless(bytes);
  } else if (ext === "png") {
    const chunks = extractPngChunks(buf, bytes);
    const metaTypes = ["tEXt", "iTXt", "zTXt", "eXIf", "tIME"];
    const keep = chunks.filter((c) => !metaTypes.includes(c.type));
    const pngSig = new Uint8Array([0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A]);
    blob = new Blob([pngSig, ...keep.map((c) => c.raw)], { type: "image/png" });
  } else if (ext === "webp") {
    const wChunks = extractWebpChunks(buf, bytes);
    const keepW = wChunks.filter((c) => !["EXIF", "XMP ", "ICCP"].includes(c.type));
    blob = buildWebpBlob(keepW);
  } else if (["docx", "xlsx", "pptx"].includes(ext)) {
    blob = await cleanOfficeZip(bytes);
  } else if (ext === "pdf") {
    blob = cleanPdfRaw(bytes);
  } else {
    blob = new Blob([buf]);
  }

  if (["jpg", "jpeg", "png", "webp"].includes(ext)) {
    blob = await stripC2paBytes(blob);
  }
  return blob;
}

async function handleSingleFile(file) {
  if (!file) return;
  S.file = file;
  S.buf = await file.arrayBuffer();
  S.ext = file.name.split(".").pop().toLowerCase();
  S.meta = { gen: {}, c2pa: null, sig: [], emb: [] };
  S.raw = {};

  $("info").innerHTML = `
    <div><b>Имя:</b> ${esc(file.name)}</div>
    <div><b>Размер:</b> ${(file.size / 1024).toFixed(2)} KB</div>
    <div><b>Формат:</b> ${S.ext.toUpperCase()}</div>
  `;
  $("prev").innerHTML = "";

  const bytes = new Uint8Array(S.buf);
  detectC2PA(bytes);

  try {
    if (["jpg", "jpeg"].includes(S.ext)) {
      await parseJpegNative(bytes);
    } else if (S.ext === "png") {
      await parsePngNative(bytes);
    } else if (S.ext === "webp") {
      await parseWebpNative(bytes);
    } else if (["tif", "tiff"].includes(S.ext)) {
      parseTiffNative(bytes);
    } else if (S.ext === "pdf") {
      parsePdfNative(bytes);
    } else if (["docx", "xlsx", "pptx"].includes(S.ext)) {
      await parseOfficeNative(bytes);
    } else {
      return alert("Формат ." + S.ext + " не поддерживается.");
    }
    $("work").style.display = "grid";
    draw();
  } catch (err) {
    alert("Ошибка при разборе файла: " + err.message);
  }
}

function detectC2PA(bytes) {
  const txt = new TextDecoder("latin1").decode(bytes);
  const idx = txt.indexOf("c2pa");
  if (idx === -1) return;
  const start = Math.max(0, idx - 64);
  const end = Math.min(bytes.length, idx + 8192);
  const sliceTxt = new TextDecoder("utf-8", { fatal: false }).decode(bytes.slice(start, end));
  const jsonBlocks = sliceTxt.match(/\{[^{}]*"(?:claim_generator|assertions|signature_info|alg|issuer|title|softwareAgent|actions|device)"[^{}]*\}/g);
  S.meta.c2pa = {
    text: jsonBlocks ? jsonBlocks.join("
---
") : sliceTxt.replace(/[^ -~Ѐ-ӿ]/g, " ").replace(/\s{2,}/g, "
")
  };
}

async function parseJpegNative(bytes) {
  const url = await toUrl(S.buf, "image/jpeg");
  $("prev").innerHTML = `<strong style="font-size:12px;">Предпросмотр (без пересжатия):</strong><br><img src="${url}">`;
  let offset = 2;
  S.raw.segments = [];
  while (offset < bytes.length - 1) {
    if (bytes[offset] !== 0xFF) break;
    const marker = bytes[offset + 1];
    if (marker === 0xDA || marker === 0xD9) {
      S.raw.segments.push({ marker, raw: bytes.slice(offset), isScan: true });
      break;
    }
    const len = (bytes[offset + 2] << 8) | bytes[offset + 3];
    const segData = bytes.slice(offset + 4, offset + 2 + len);
    const fullSeg = bytes.slice(offset, offset + 2 + len);
    S.raw.segments.push({ marker, raw: fullSeg, data: segData });

    if (marker >= 0xE1 && marker <= 0xEF || marker === 0xFE) {
      const label = marker === 0xE1 ? "APP1_EXIF_XMP" : (marker === 0xE2 ? "APP2_ICC" : (marker === 0xED ? "APP13_IPTC" : (marker === 0xFE ? "Comment" : "APP" + (marker - 0xE0))));
      const decoded = new TextDecoder("utf-8", { fatal: false }).decode(segData).replace(/[^ -~Ѐ-ӿ]/g, " ").replace(/\s+/g, " ").trim();
      S.meta.gen[`${label}_${offset}`] = decoded.slice(0, 300) || `[Бинарный блок ${len} байт]`;
    }
    offset += 2 + len;
  }
}

function cleanJpegLossless(bytes) {
  if (bytes[0] !== 0xFF || bytes[1] !== 0xD8) return new Blob([bytes], { type: "image/jpeg" });
  const out = [new Uint8Array([0xFF, 0xD8])];
  let offset = 2;
  while (offset < bytes.length - 1) {
    if (bytes[offset] !== 0xFF) break;
    const marker = bytes[offset + 1];
    if (marker === 0xDA || marker === 0xD9) {
      out.push(bytes.slice(offset));
      break;
    }
    const len = (bytes[offset + 2] << 8) | bytes[offset + 3];
    const isMeta = (marker >= 0xE1 && marker <= 0xEF) || marker === 0xFE;
    if (!isMeta) {
      out.push(bytes.slice(offset, offset + 2 + len));
    }
    offset += 2 + len;
  }
  return new Blob(out, { type: "image/jpeg" });
}

async function parsePngNative(bytes) {
  const url = await toUrl(S.buf, "image/png");
  $("prev").innerHTML = `<strong style="font-size:12px;">Предпросмотр (без пересжатия):</strong><br><img src="${url}">`;
  S.raw.chunks = extractPngChunks(S.buf, bytes);
  S.raw.chunks.forEach((c, idx) => {
    if (["tEXt", "iTXt", "zTXt", "eXIf", "tIME"].includes(c.type)) {
      S.meta.gen[`PNG_${c.type}_${idx}`] = new TextDecoder("utf-8", { fatal: false }).decode(c.data).replace(/␀/g, ": ");
    }
  });
}

function extractPngChunks(buf, bytes) {
  const view = new DataView(buf);
  let o = 8;
  const res = [];
  while (o < view.byteLength) {
    const len = view.getUint32(o);
    const type = String.fromCharCode(...bytes.slice(o + 4, o + 8));
    const data = bytes.slice(o + 8, o + 8 + len);
    res.push({ type, raw: bytes.slice(o, o + 12 + len), data });
    o += 12 + len;
  }
  return res;
}

async function parseWebpNative(bytes) {
  const url = await toUrl(S.buf, "image/webp");
  $("prev").innerHTML = `<strong style="font-size:12px;">Предпросмотр (без пересжатия):</strong><br><img src="${url}">`;
  S.raw.chunks = extractWebpChunks(S.buf, bytes);
  S.raw.chunks.forEach((c, idx) => {
    if (["EXIF", "XMP ", "ICCP"].includes(c.type)) {
      S.meta.gen[`WEBP_${c.type.trim()}_${idx}`] = new TextDecoder("utf-8", { fatal: false }).decode(c.data).replace(/[^ -~Ѐ-ӿ]/g, " ").trim();
    }
  });
}

function extractWebpChunks(buf, bytes) {
  const view = new DataView(buf);
  let o = 12;
  const res = [];
  while (o < view.byteLength) {
    const type = String.fromCharCode(...bytes.slice(o, o + 4));
    const len = view.getUint32(o + 4, true);
    const pad = len + (len % 2);
    const data = bytes.slice(o + 8, o + 8 + len);
    res.push({ type, raw: bytes.slice(o, o + 8 + pad), data });
    o += 8 + pad;
  }
  return res;
}

function buildWebpBlob(chunks) {
  const body = new Blob(chunks.map((c) => c.raw));
  const head = new Uint8Array(12);
  head.set([0x52, 0x49, 0x46, 0x46], 0);
  new DataView(head.buffer).setUint32(4, 4 + body.size, true);
  head.set([0x57, 0x45, 0x42, 0x50], 8);
  return new Blob([head, body], { type: "image/webp" });
}

function parseTiffNative(bytes) {
  $("prev").innerHTML = `<div class="note">TIFF загружен. Выполнен поиск строковых тегов и C2PA.</div>`;
  const strs = new TextDecoder("utf-8", { fatal: false }).decode(bytes).match(/[A-Za-z0-9_.\-: /]{6,}/g) || [];
  S.meta.gen["TIFF_Strings"] = strs.slice(0, 35).join(" | ");
}

function parsePdfNative(bytes) {
  const rawStr = new TextDecoder("latin1").decode(bytes);
  const fields = ["Title", "Author", "Subject", "Keywords", "Creator", "Producer", "CreationDate", "ModDate"];
  fields.forEach((f) => {
    const rx = new RegExp(`/${f}\s*\(([^)]*)\)`);
    const m = rawStr.match(rx);
    if (m && m[1]) S.meta.gen[f] = m[1];
  });
  const eofCount = (rawStr.match(/%%EOF/g) || []).length;
  if (eofCount > 1) S.meta.emb.push(`Найдено ${eofCount} инкрементальных версий документа.`);
  const xmp = rawStr.match(/<x:xmpmeta[\s\S]*?<\/x:xmpmeta>/);
  if (xmp) S.meta.gen["XMP_Metadata"] = xmp[0].slice(0, 600);
  const sigs = rawStr.match(/\/Type\s*\/Sig[\s\S]{0,600}/g) || [];
  sigs.forEach((s, i) => {
    const signer = (s.match(/\/Name\s*\(([^)]+)\)/) || [])[1] || `Подпись PDF #${i + 1}`;
    S.meta.sig.push({ signer, raw: s.slice(0, 400) });
  });
  const fonts = Array.from(new Set(rawStr.match(/\/BaseFont\s*\/([A-Za-z0-9+\-]+)/g) || []));
  if (fonts.length) S.meta.emb.push("Шрифты: " + fonts.map((f) => f.replace("/BaseFont", "").trim()).join(", "));
  $("prev").innerHTML = `<div class="note">PDF разобран локально. Метаданные извлечены.</div>`;
}

function cleanPdfRaw(bytes) {
  let rawStr = new TextDecoder("latin1").decode(bytes);
  const fields = ["Title", "Author", "Subject", "Keywords", "Creator", "Producer", "CreationDate", "ModDate"];
  fields.forEach((f) => {
    const rx = new RegExp(`(/${f}\s*\()([^)]*)(\))`, "g");
    rawStr = rawStr.replace(rx, (_, a, val, b) => a + " ".repeat(val.length) + b);
  });
  rawStr = rawStr.replace(/<x:xmpmeta[\s\S]*?<\/x:xmpmeta>/g, (m) => " ".repeat(m.length));
  const out = new Uint8Array(rawStr.length);
  for (let i = 0; i < rawStr.length; i++) out[i] = rawStr.charCodeAt(i) & 0xFF;
  return new Blob([out], { type: "application/pdf" });
}

async function parseOfficeNative(bytes) {
  const entries = readZipEntries(bytes);
  S.raw.zipEntries = entries;
  for (const e of entries) {
    if (e.name.startsWith("docProps/") && e.name.endsWith(".xml")) {
      const xmlStr = await inflateEntry(e);
      if (xmlStr) {
        const doc = new DOMParser().parseFromString(xmlStr, "application/xml");
        Array.from(doc.documentElement.children).forEach((n) => {
          S.meta.gen[`${e.name.split("/").pop()}:${n.nodeName}`] = n.textContent;
        });
      }
    }
    if (e.name.includes("thumbnail")) {
      S.meta.emb.push(`Встроенная миниатюра: ${e.name} (будет удалена при очистке)`);
    }
    if (e.name.includes("media/")) {
      S.meta.emb.push(`Встроенный медиафайл: ${e.name}`);
    }
    if (e.name.startsWith("_xmlsignatures/")) {
      S.meta.sig.push({ signer: e.name, raw: "Цифровая XML-подпись Office" });
    }
  }
  $("prev").innerHTML = `<div class="note">Документ Office (${S.ext.toUpperCase()}) распакован локально.</div>`;
}

async function cleanOfficeZip(bytes) {
  const entries = readZipEntries(bytes);
  const cleanList = [];
  for (const e of entries) {
    if (e.name.startsWith("_xmlsignatures/") || e.name.includes("thumbnail") || e.name === "docProps/custom.xml") {
      continue;
    }
    if (e.name === "docProps/core.xml" || e.name === "docProps/app.xml") {
      const emptyXml = new TextEncoder().encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"></Properties>');
      cleanList.push({ name: e.name, data: emptyXml });
    } else {
      const rawData = await inflateEntryBytes(e);
      if (rawData) cleanList.push({ name: e.name, data: rawData });
    }
  }
  return buildSimpleZip(cleanList);
}

function readZipEntries(bytes) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd === -1) return [];
  const total = view.getUint16(eocd + 10, true);
  let ptr = view.getUint32(eocd + 16, true);
  const res = [];
  for (let i = 0; i < total; i++) {
    if (view.getUint32(ptr, true) !== 0x02014b50) break;
    const method = view.getUint16(ptr + 10, true);
    const compSize = view.getUint32(ptr + 20, true);
    const nameLen = view.getUint16(ptr + 28, true);
    const extraLen = view.getUint16(ptr + 30, true);
    const commLen = view.getUint16(ptr + 32, true);
    const localOffset = view.getUint32(ptr + 42, true);
    const name = new TextDecoder("utf-8").decode(bytes.slice(ptr + 46, ptr + 46 + nameLen));
    const lNameLen = view.getUint16(localOffset + 26, true);
    const lExtraLen = view.getUint16(localOffset + 28, true);
    const dataStart = localOffset + 30 + lNameLen + lExtraLen;
    const compData = bytes.slice(dataStart, dataStart + compSize);
    res.push({ name, method, compData });
    ptr += 46 + nameLen + extraLen + commLen;
  }
  return res;
}

async function inflateEntryBytes(entry) {
  if (entry.method === 0) return entry.compData;
  if (entry.method === 8 && typeof DecompressionStream !== "undefined") {
    const ds = new DecompressionStream("deflate-raw");
    const writer = ds.writable.getWriter();
    writer.write(entry.compData);
    writer.close();
    const buf = await new Response(ds.readable).arrayBuffer();
    return new Uint8Array(buf);
  }
  return null;
}

async function inflateEntry(entry) {
  const b = await inflateEntryBytes(entry);
  return b ? new TextDecoder("utf-8", { fatal: false }).decode(b) : null;
}

function buildSimpleZip(files) {
  const parts = [];
  const central = [];
  let offset = 0;
  for (const f of files) {
    const nameBytes = new TextEncoder().encode(f.name);
    const crc = crc32(f.data);
    const lh = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, f.data.length, true);
    lv.setUint32(22, f.data.length, true);
    lv.setUint16(26, nameBytes.length, true);
    lh.set(nameBytes, 30);
    parts.push(lh, f.data);

    const ch = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, f.data.length, true);
    cv.setUint32(24, f.data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint32(42, offset, true);
    ch.set(nameBytes, 46);
    central.push(ch);

    offset += lh.length + f.data.length;
  }
  const cdOffset = offset;
  let cdSize = 0;
  central.forEach((c) => { parts.push(c); cdSize += c.length; });
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, cdOffset, true);
  parts.push(eocd);
  return new Blob(parts, { type: "application/zip" });
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c;
  }
  return t;
})();

function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function draw() {
  const list = [
    { id: "gen", lbl: `Основные (${Object.keys(S.meta.gen).length})` },
    { id: "c2pa", lbl: `C2PA / ИИ ${S.meta.c2pa ? "⚠️" : ""}` },
    { id: "sig", lbl: `Подписи (${S.meta.sig.length})` },
    { id: "emb", lbl: `Встроенное (${S.meta.emb.length})` }
  ];
  $("tabs").innerHTML = list.map((t) => `<button class="tab ${S.tab === t.id ? "active" : ""}" onclick="S.tab='${t.id}';draw()">${t.lbl}</button>`).join("");
  $("banner").innerHTML = "";
  $("add").style.display = S.tab === "gen" ? "inline-block" : "none";

  if (S.tab === "gen") {
    const html = Object.entries(S.meta.gen).map(([rawKey, rawVal]) => {
      const k = esc(rawKey), v = esc(rawVal);
      return `<div class="row">
        <input value="${k}" readonly style="color:var(--muted)">
        <input value="${v}" onchange="updateField('${k}', this.value)">
        <button class="btn-del" onclick="deleteField('${k}')">✕</button>
      </div>`;
    }).join("");
    $("fields").innerHTML = html || `<p style="color:var(--muted);font-size:13px;">Метаданные отсутствуют или полностью очищены.</p>`;
  } else if (S.tab === "c2pa") {
    $("banner").innerHTML = `<div class="note">Инструмент не проверяет подпись C2PA: данные отображаются так, как записаны в файле. Вы можете отредактировать или удалить весь блок.</div>`;
    $("fields").innerHTML = S.meta.c2pa
      ? `<textarea onchange="S.meta.c2pa.text=this.value">${esc(S.meta.c2pa.text)}</textarea><button class="btn-red" onclick="S.meta.c2pa=null;draw()">Удалить C2PA полностью</button>`
      : `<p style="color:var(--muted);font-size:13px;">Учетные данные C2PA / метки ИИ не обнаружены.</p>`;
  } else if (S.tab === "sig") {
    $("banner").innerHTML = `<div class="note">Инструмент не проверяет подпись: любое имя может написать кто угодно. После любых изменений подпись перестает быть действительной.</div>`;
    $("fields").innerHTML = S.meta.sig.map((s, i) => `
      <div class="box" style="margin-bottom:10px;background:var(--bg);">
        <div style="margin-bottom:6px;"><small>Подписант:</small><input value="${esc(s.signer)}" onchange="S.meta.sig[${i}].signer=this.value"></div>
        <div style="margin-bottom:6px;"><small>Сертификат / Данные:</small><textarea onchange="S.meta.sig[${i}].raw=this.value">${esc(s.raw)}</textarea></div>
        <button class="btn-red" onclick="S.meta.sig.splice(${i},1);draw()">Удалить подпись</button>
      </div>`).join("") || `<p style="color:var(--muted);font-size:13px;">Цифровые подписи не обнаружены.</p>`;
  } else {
    $("fields").innerHTML = S.meta.emb.map((x) => `<div class="note">${esc(x)}</div>`).join("") || `<p style="color:var(--muted);font-size:13px;">Встроенные объекты не найдены.</p>`;
  }
}

window.updateField = (key, val) => { S.meta.gen[key] = val; };
window.deleteField = (key) => { delete S.meta.gen[key]; draw(); };

$("add").onclick = () => {
  const k = prompt("Введите название поля (например: Author, Title, Software, Comment):");
  if (k) { S.meta.gen[k] = ""; draw(); }
};

$("purge").onclick = () => {
  S.meta.gen = {};
  S.meta.c2pa = null;
  S.meta.sig = [];
  draw();
};

$("save").onclick = async () => {
  const bytes = new Uint8Array(S.buf);
  let blob;

  if (["jpg", "jpeg"].includes(S.ext)) {
    blob = cleanJpegLossless(bytes);
    const customKeys = Object.entries(S.meta.gen).filter(([k]) => !k.startsWith("APP") && !k.startsWith("Comment_"));
    if (customKeys.length) {
      const commentText = customKeys.map(([k, v]) => `${k}: ${v}`).join("; ");
      const comBytes = new TextEncoder().encode(commentText);
      const comSeg = new Uint8Array(4 + comBytes.length);
      comSeg[0] = 0xFF; comSeg[1] = 0xFE;
      comSeg[2] = ((comBytes.length + 2) >> 8) & 0xFF;
      comSeg[3] = (comBytes.length + 2) & 0xFF;
      comSeg.set(comBytes, 4);
      const cleanArr = new Uint8Array(await blob.arrayBuffer());
      blob = new Blob([cleanArr.slice(0, 2), comSeg, cleanArr.slice(2)], { type: "image/jpeg" });
    }
  } else if (S.ext === "png") {
    const metaTypes = ["tEXt", "iTXt", "zTXt", "eXIf", "tIME"];
    const keep = S.raw.chunks.filter((c) => !metaTypes.includes(c.type));
    const iendIdx = keep.findIndex((c) => c.type === "IEND");
    const customChunks = [];
    Object.entries(S.meta.gen).forEach(([k, v]) => {
      if (!k.startsWith("PNG_")) customChunks.push(buildPngTextChunk(k, v));
    });
    if (iendIdx !== -1) keep.splice(iendIdx, 0, ...customChunks);
    const pngSig = new Uint8Array([0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A]);
    blob = new Blob([pngSig, ...keep.map((c) => c.raw)], { type: "image/png" });
  } else if (S.ext === "webp") {
    const keepW = S.raw.chunks.filter((c) => !["EXIF", "XMP ", "ICCP"].includes(c.type));
    blob = buildWebpBlob(keepW);
  } else if (S.ext === "pdf") {
    blob = cleanPdfRaw(bytes);
  } else if (["docx", "xlsx", "pptx"].includes(S.ext)) {
    blob = await cleanOfficeZip(bytes);
  } else {
    blob = new Blob([S.buf]);
  }

  if (S.meta.c2pa === null && ["jpg", "jpeg", "png", "webp"].includes(S.ext)) {
    blob = await stripC2paBytes(blob);
  }

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "clean_" + S.file.name;
  a.click();
};

async function stripC2paBytes(blob) {
  const arr = new Uint8Array(await blob.arrayBuffer());
  const str = new TextDecoder("latin1").decode(arr);
  let pos = 0;
  let modified = false;
  while (true) {
    const idx = str.indexOf("c2pa", pos);
    if (idx === -1) break;
    arr.set([0x00, 0x00, 0x00, 0x00], idx);
    pos = idx + 4;
    modified = true;
  }
  return modified ? new Blob([arr], { type: blob.type }) : blob;
}

function buildPngTextChunk(key, val) {
  const data = new TextEncoder().encode(key + "␀" + val);
  const chunk = new Uint8Array(12 + data.length);
  new DataView(chunk.buffer).setUint32(0, data.length);
  chunk.set([0x74, 0x45, 0x58, 0x74], 4);
  chunk.set(data, 8);
  const crc = crc32(chunk.slice(4, 8 + data.length));
  new DataView(chunk.buffer).setUint32(8 + data.length, crc);
  return { type: "tEXt", raw: chunk };
}

function toUrl(b, m) {
  return new Promise((r) => {
    const fr = new FileReader();
    fr.onload = (e) => r(e.target.result);
    fr.readAsDataURL(new Blob([b], { type: m }));
  });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}
