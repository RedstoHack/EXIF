<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalMeta Forensic</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --hover: #334155;
    --text: #f8fafc; --muted: #94a3b8; --blue: #3b82f6;
    --red: #ef4444; --green: #10b981; --border: #334155;
  }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { background: var(--bg); color: var(--text); margin: 0; padding: 14px; display: flex; justify-content: center; }
  .wrap { max-width: 1060px; width: 100%; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
  .badge { background: rgba(16,185,129,0.15); color: var(--green); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .drop { display: block; border: 2px dashed var(--border); border-radius: 12px; padding: 30px 16px; text-align: center; background: var(--card); cursor: pointer; }
  .drop:hover, .drop.drag { border-color: var(--blue); background: var(--hover); }
  .pick-btn { display: inline-block; background: var(--blue); color: #fff; padding: 10px 18px; border-radius: 8px; font-weight: 600; margin-top: 10px; font-size: 14px; }
  .file-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .grid { display: none; grid-template-columns: 300px 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .row { display: grid; grid-template-columns: 170px 1fr 34px; gap: 8px; margin-bottom: 8px; align-items: center; }
  input, textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; width: 100%; font-size: 13px; }
  textarea { min-height: 130px; font-family: monospace; resize: vertical; }
  button { cursor: pointer; border: none; border-radius: 6px; padding: 10px 14px; font-weight: 600; }
  .btn-blue { background: var(--blue); color: #fff; width: 100%; margin-top: 10px; }
  .btn-red { background: var(--red); color: #fff; width: 100%; margin-top: 10px; }
  .btn-green { background: var(--green); color: #fff; width: 100%; margin-top: 10px; }
  .btn-del { background: rgba(239,68,68,0.2); color: var(--red); padding: 8px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 10px; flex-wrap: wrap; }
  .tab { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 10px; font-size: 12px; }
  .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .note { background: rgba(245,158,11,0.15); border-left: 4px solid #f59e0b; padding: 10px 12px; font-size: 13px; margin-bottom: 10px; border-radius: 4px; word-break: break-word; }
  .prev img { max-width: 100%; max-height: 180px; object-fit: contain; border-radius: 6px; margin-top: 8px; border: 1px solid var(--border); background: #000; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h2 style="margin:0;">LocalMeta Forensic</h2><small style="color:var(--muted)">PDF Fonts/Engine • EXIF/XMP/Thumbnail • C2PA/AI • Office</small></div>
    <div class="badge" id="libStatus">⏳ Подключение модулей...</div>
  </header>
  <label class="drop" id="drop" for="inp">
    <div style="font-size:16px; font-weight:600;">Выберите один или несколько файлов</div>
    <div style="color:var(--muted); font-size:13px; margin-top:4px;">1 файл — полный разбор и редактор. 2+ файлов — пакетная очистка в ZIP.</div>
    <div class="pick-btn">📂 Выбрать файлы с устройства</div>
    <input type="file" id="inp" class="file-hidden" multiple>
  </label>
  <div class="box" id="batchBox" style="display:none; margin-top:16px;">
    <h3 style="margin-top:0;">Пакетная очистка файлов</h3>
    <div id="batchLog" style="font-size:13px; color:var(--muted); line-height:1.7; max-height:240px; overflow-y:auto;"></div>
    <button class="btn-green" id="batchDownload" style="display:none;">📦 Скачать очищенный ZIP-архив</button>
  </div>
  <div class="grid" id="work">
    <div class="box">
      <h4 style="margin-top:0;">Информация о файле</h4>
      <div id="info" style="font-size:13px; color:var(--muted); line-height:1.6;"></div>
      <div class="prev" id="prev" style="margin-top:10px;"></div>
      <button class="btn-red" id="purge">🧹 Удалить ВСЕ метаданные</button>
      <button class="btn-blue" id="save">💾 Скачать готовый файл</button>
    </div>
    <div class="box">
      <div class="tabs" id="tabs"></div>
      <div id="banner"></div>
      <div id="fields"></div>
      <button class="tab" id="add" style="margin-top:10px;">+ Добавить поле</button>
    </div>
  </div>
</div>
<script>
var S = { file: null, buf: null, ext: "", tab: "gen", meta: { gen: {}, c2pa: null, sig: Array.of(), emb: Array.of() }, raw: {}, batchZip: null };
function $(id) { return document.getElementById(id); }

function loadLib(urls) {
  return new Promise(function(resolve) {
    var i = 0;
    function tryNext() {
      if (i >= urls.length) return resolve(false);
      var s = document.createElement("script");
      s.src = urls.at(i); i = i + 1;
      s.onload = function() { resolve(true); };
      s.onerror = function() { s.remove(); tryNext(); };
      document.head.appendChild(s);
    }
    tryNext();
  });
}

Promise.all(Array.of(
  loadLib(Array.of("https://cloudflare.com", "https://jsdelivr.net")),
  loadLib(Array.of("https://cloudflare.com", "https://jsdelivr.net")),
  loadLib(Array.of("https://cloudflare.com", "https://jsdelivr.net")),
  loadLib(Array.of("https://cloudflare.com", "https://jsdelivr.net"))
)).then(function(res) {
  var ok = res.filter(Boolean).length;
  $("libStatus").textContent = ok === 4 ? "🔒 Все 4 модуля активны" : "⚠️ Модулей: " + ok + "/4 + нативный движок";
});

$("drop").ondragover = function(e) { e.preventDefault(); $("drop").classList.add("drag"); };
$("drop").ondragleave = function() { $("drop").classList.remove("drag"); };
$("drop").ondrop = function(e) {
  e.preventDefault(); $("drop").classList.remove("drag");
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) routeFiles(e.dataTransfer.files);
};
$("inp").onchange = function(e) {
  if (e.target && e.target.files && e.target.files.length) routeFiles(e.target.files);
};

function routeFiles(list) {
  if (list.length === 1) {
    $("batchBox").style.display = "none";
    handleSingle(list.item(0));
  } else {
    $("work").style.display = "none";
    handleBatch(list);
  }
}

async function handleBatch(list) {
  if (!window.JSZip) return alert("Дождитесь загрузки модулей (4/4) или проверьте интернет.");
  $("batchBox").style.display = "block";
  $("batchDownload").style.display = "none";
  $("batchLog").innerHTML = "Обработка " + list.length + " файлов...<br>";
  var zip = new JSZip();
  for (var i = 0; i < list.length; i++) {
    var f = list.item(i);
    try {
      var clean = await quickClean(f);
      zip.file("clean_" + f.name, clean);
      $("batchLog").innerHTML += "✅ " + esc(f.name) + " — очищен<br>";
    } catch (e) {
      $("batchLog").innerHTML += "❌ " + esc(f.name) + " — " + esc(e.message) + "<br>";
    }
  }
  S.batchZip = await zip.generateAsync({ type: "blob" });
  $("batchDownload").style.display = "block";
}

$("batchDownload").onclick = function() {
  if (!S.batchZip) return;
  var a = document.createElement("a");
  a.href = URL.createObjectURL(S.batchZip);
  a.download = "cleaned_files.zip";
  a.click();
};

async function handleSingle(file) {
  if (!file) return;
  S.file = file; S.buf = await file.arrayBuffer();
  S.ext = file.name.split(".").pop().toLowerCase();
  S.meta = { gen: {}, c2pa: null, sig: Array.of(), emb: Array.of() }; S.raw = {};
  $("info").innerHTML = "<div><b>Файл:</b> " + esc(file.name) + "</div><div><b>Размер:</b> " + (file.size / 1024).toFixed(2) + " KB</div>";
  $("prev").innerHTML = "";
  var bytes = new Uint8Array(S.buf);
  detectC2PA(bytes);

  if (Array.of("jpg", "jpeg", "png", "webp", "tif", "tiff").includes(S.ext)) await parseImage(bytes);
  else if (S.ext === "pdf") await parsePDFHybrid(bytes);
  else if (Array.of("docx", "xlsx", "pptx").includes(S.ext)) await parseOffice();
  else return alert("Формат ." + S.ext + " не поддерживается.");

  $("work").style.display = "grid";
  draw();
}

function decodePdfHex(hex) {
  var clean = hex.replace(/\s+/g, "");
  if (clean.startsWith("FEFF") || clean.startsWith("feff")) {
    var out = "";
    for (var i = 4; i + 3 < clean.length; i += 4) out += String.fromCharCode(parseInt(clean.slice(i, i + 4), 16));
    return out;
  }
  var ascii = "";
  for (var j = 0; j + 1 < clean.length; j += 2) {
    var code = parseInt(clean.slice(j, j + 2), 16);
    if (code >= 32) ascii += String.fromCharCode(code);
  }
  return ascii;
}

function readPdfDictValue(str, key) {
  var pos = 0;
  while (true) {
    var idx = str.indexOf(key, pos);
    if (idx === -1) return "";
    var p = idx + key.length;
    while (p < str.length && (str.charAt(p) === " " || str.charAt(p) === "\r" || str.charAt(p) === "\n")) p++;
    if (str.charAt(p) === "(") {
      var depth = 1, end = p + 1;
      while (end < str.length && depth > 0) {
        if (str.charAt(end) === "\\") { end += 2; continue; }
        if (str.charAt(end) === "(") depth++;
        else if (str.charAt(end) === ")") depth--;
        end++;
      }
      var val = str.slice(p + 1, end - 1);
      if (val.charCodeAt(0) === 254 && val.charCodeAt(1) === 255) {
        var u16 = "";
        for (var i = 2; i + 1 < val.length; i += 2) u16 += String.fromCharCode((val.charCodeAt(i) << 8) | val.charCodeAt(i + 1));
        return u16;
      }
      return val;
    } else if (str.charAt(p) === "<" && str.charAt(p + 1) !== "<") {
      var hEnd = str.indexOf(">", p + 1);
      if (hEnd !== -1) return decodePdfHex(str.slice(p + 1, hEnd));
    }
    pos = idx + key.length;
  }
}

async function inflatePdfStreams(bytes, rawStr) {
  if (typeof DecompressionStream === "undefined") return "";
  var combined = "", pos = 0;
  while (true) {
    var sIdx = rawStr.indexOf("stream", pos);
    if (sIdx === -1) break;
    var start = sIdx + 6;
    if (rawStr.charAt(start) === "\r") start++;
    if (rawStr.charAt(start) === "\n") start++;
    var eIdx = rawStr.indexOf("endstream", start);
    if (eIdx === -1) break;
    var chunk = bytes.slice(start, eIdx);
    if (chunk.length > 2 && chunk.length < 300000) {
      try {
        var ds = new DecompressionStream("deflate");
        var writer = ds.writable.getWriter();
        writer.write(chunk);
        writer.close();
        var outBuf = await new Response(ds.readable).arrayBuffer();
        combined += "\n" + new TextDecoder("latin1").decode(new Uint8Array(outBuf));
      } catch (e) {}
    }
    pos = eIdx + 9;
  }
  return combined;
}

function scanPdfTokens(rawStr, key) {
  var found = Array.of(), pos = 0;
  while (true) {
    var idx = rawStr.indexOf(key, pos);
    if (idx === -1) break;
    var start = idx + key.length;
    while (start < rawStr.length && (rawStr.charAt(start) === " " || rawStr.charAt(start) === "/")) start++;
    var end = start;
    while (end < rawStr.length) {
      var ch = rawStr.charAt(end);
      if (ch === " " || ch === "\r" || ch === "\n" || ch === "/" || ch === ">" || ch === ")" || ch === "]") break;
      end++;
    }
    var val = rawStr.slice(start, end);
    if (val.length > 7 && val.charAt(6) === "+") val = val.slice(7);
    if (val && !found.includes(val)) found.push(val);
    pos = end;
  }
  return found;
}

async function parsePDFHybrid(bytes) {
  var rawStr = new TextDecoder("latin1").decode(bytes);
  var inflated = await inflatePdfStreams(bytes, rawStr);
  var fullCorpus = rawStr + "\n" + inflated;

  var ver = rawStr.slice(0, 12).trim();
  if (ver.startsWith("%PDF-")) S.meta.gen["PDF_Version"] = ver.replace("%PDF-", "");

  var fields = Array.of(
    Array.of("Title", "/Title"), Array.of("Author", "/Author"), Array.of("Subject", "/Subject"),
    Array.of("Creator", "/Creator"), Array.of("PDF_Engine (Producer)", "/Producer"),
    Array.of("Creation_Date", "/CreationDate"), Array.of("Modification_Date", "/ModDate")
  );
  for (var i = 0; i < fields.length; i++) {
    var f = fields.at(i);
    var v = readPdfDictValue(fullCorpus, f.at(1));
    if (v) S.meta.gen[f.at(0)] = v;
  }

  if (window.PDFLib) {
    try {
      var pdf = await PDFLib.PDFDocument.load(S.buf, { ignoreEncryption: true });
      S.raw.pdf = pdf;
      if (pdf.getTitle()) S.meta.gen["Title"] = pdf.getTitle();
      if (pdf.getAuthor()) S.meta.gen["Author"] = pdf.getAuthor();
      if (pdf.getCreator()) S.meta.gen["Creator"] = pdf.getCreator();
      if (pdf.getProducer()) S.meta.gen["PDF_Engine (Producer)"] = pdf.getProducer();
      if (pdf.getCreationDate()) S.meta.gen["Creation_Date"] = pdf.getCreationDate().toISOString();
      if (pdf.getModificationDate()) S.meta.gen["Modification_Date"] = pdf.getModificationDate().toISOString();
      $("prev").innerHTML = "<div class='note'>PDF (" + pdf.getPageCount() + " стр.). Все поля и шрифты извлечены.</div>";
    } catch (e) {}
  }

  var fonts = scanPdfTokens(fullCorpus, "/BaseFont").concat(scanPdfTokens(fullCorpus, "/FontName"));
  var uniqFonts = Array.from(new Set(fonts));
  if (uniqFonts.length) S.meta.emb.push("Встроенные шрифты (" + uniqFonts.length + "): " + uniqFonts.join(", "));

  var eofCount = rawStr.split("%%EOF").length - 1;
  if (eofCount > 1) S.meta.emb.push("Инкрементальных версий (%%EOF): " + eofCount);
  if (fullCorpus.includes("/JavaScript") || fullCorpus.includes("/JS")) S.meta.emb.push("⚠️ Обнаружен встроенный JavaScript!");
  if (fullCorpus.includes("/EmbeddedFile")) S.meta.emb.push("⚠️ Обнаружены вложенные файлы (/EmbeddedFile)");
  if (fullCorpus.includes("/URI")) S.meta.emb.push("В документе есть внешние ссылки (/URI)");
  if (fullCorpus.includes("/Type /Sig") || fullCorpus.includes("/Type/Sig")) S.meta.sig.push({ signer: "Подпись PDF", raw: "Словарь /Sig" });
}
  function detectC2PA(bytes) {
  var txt = new TextDecoder("latin1").decode(bytes);
  var idx = txt.indexOf("c2pa");
  if (idx === -1) return;
  var slice = new TextDecoder("utf-8", { fatal: false }).decode(bytes.slice(Math.max(0, idx - 64), Math.min(bytes.length, idx + 8192)));
  var out = "";
  for (var i = 0; i < slice.length; i++) {
    var c = slice.charCodeAt(i);
    out += ((c >= 32 && c <= 126) || (c >= 1040 && c <= 1103)) ? slice.charAt(i) : " ";
  }
  S.meta.c2pa = { text: out.replace(/\s+/g, " ").trim() };
}

async function parseImage(bytes) {
  if (Array.of("jpg", "jpeg", "png", "webp").includes(S.ext)) {
    var url = await toUrl(S.buf, "image/" + (S.ext === "jpg" ? "jpeg" : S.ext));
    $("prev").innerHTML = "<strong style='font-size:12px;'>Предпросмотр:</strong><br><img src='" + url + "'>";
  }

  if (window.exifr) {
    try {
      var parsed = await exifr.parse(S.buf, { xmp: true, iptc: true, icc: true, jfif: true, ihdr: true });
      if (parsed) {
        Object.entries(parsed).forEach(function(pair) {
          var k = pair.at(0), v = pair.at(1);
          if (v !== undefined && v !== null && !(v instanceof Uint8Array)) S.meta.gen[k] = typeof v === "object" ? JSON.stringify(v) : String(v);
        });
      }
      var gps = await exifr.gps(S.buf);
      if (gps && gps.latitude) S.meta.emb.push("📍 GPS координаты: " + gps.latitude.toFixed(6) + ", " + gps.longitude.toFixed(6));
      var thumb = await exifr.thumbnailUrl(S.buf);
      if (thumb) S.meta.emb.push("⚠️ Внутри EXIF зашита скрытая миниатюра исходного снимка.");
    } catch (e) {}
  }

  if (Array.of("jpg", "jpeg").includes(S.ext)) {
    S.raw.jpgSegments = parseJpegSegments(bytes);
    if (window.piexif) {
      try { S.raw.ex = piexif.load(await toUrl(S.buf, "image/jpeg")); } catch (e) { S.raw.ex = { "0th": {}, "Exif": {}, "GPS": {}, "1st": {} }; }
    }
  } else if (S.ext === "png") {
    S.raw.chunks = extractPngChunks(S.buf, bytes);
    S.raw.chunks.forEach(function(c, idx) {
      if (Array.of("tEXt", "iTXt", "zTXt", "eXIf", "tIME").includes(c.type)) {
        S.meta.gen["PNG_" + c.type + "_" + idx] = new TextDecoder("utf-8", { fatal: false }).decode(c.data).split("\0").join(": ");
      }
    });
  } else if (S.ext === "webp") {
    S.raw.chunks = extractWebpChunks(S.buf, bytes);
  }
}

function parseJpegSegments(bytes) {
  var segs = Array.of(), o = 2;
  while (o < bytes.length - 1) {
    if (bytes.at(o) !== 0xFF) break;
    var marker = bytes.at(o + 1);
    if (marker === 0xDA) { segs.push({ marker: marker, raw: bytes.slice(o) }); break; }
    var len = (bytes.at(o + 2) << 8) | bytes.at(o + 3);
    segs.push({ marker: marker, raw: bytes.slice(o, o + 2 + len) });
    o += 2 + len;
  }
  return segs;
}

function extractPngChunks(buf, bytes) {
  var view = new DataView(buf), o = 8, res = Array.of();
  while (o < view.byteLength) {
    var len = view.getUint32(o);
    var type = String.fromCharCode.apply(null, bytes.slice(o + 4, o + 8));
    var data = bytes.slice(o + 8, o + 8 + len);
    res.push({ type: type, raw: bytes.slice(o, o + 12 + len), data: data });
    o += 12 + len;
  }
  return res;
}

function extractWebpChunks(buf, bytes) {
  var view = new DataView(buf), o = 12, res = Array.of();
  while (o < view.byteLength) {
    var type = String.fromCharCode.apply(null, bytes.slice(o, o + 4));
    var len = view.getUint32(o + 4, true);
    var pad = len + (len % 2);
    res.push({ type: type, raw: bytes.slice(o, o + 8 + pad) });
    o += 8 + pad;
  }
  return res;
}

async function parseOffice() {
  if (!window.JSZip) return alert("Модуль JSZip еще загружается, подождите пару секунд.");
  var zip = await JSZip.loadAsync(S.buf);
  S.raw.zip = zip;
  var parser = new DOMParser();
  var props = Array.of("docProps/core.xml", "docProps/app.xml", "docProps/custom.xml");
  for (var i = 0; i < props.length; i++) {
    var xmlPath = props.at(i);
    if (zip.file(xmlPath)) {
      var doc = parser.parseFromString(await zip.file(xmlPath).async("string"), "application/xml");
      Array.from(doc.documentElement.children).forEach(function(n) {
        S.meta.gen[xmlPath.split("/").pop() + ":" + n.nodeName] = n.textContent;
      });
    }
  }
  var allPaths = Object.keys(zip.files);
  for (var j = 0; j < allPaths.length; j++) {
    var path = allPaths.at(j);
    if (path.includes("comments.xml")) S.meta.emb.push("⚠️ Найдены скрытые комментарии рецензентов (" + path + ")");
    if (path.includes("thumbnail")) $("prev").innerHTML = "<strong style='font-size:12px;'>Миниатюра документа:</strong><br><img src='" + URL.createObjectURL(await zip.file(path).async("blob")) + "'>";
    if (path.includes("media/")) S.meta.emb.push("Встроенный медиафайл: " + path + " (EXIF будет очищен)");
    if (path.startsWith("_xmlsignatures/")) S.meta.sig.push({ signer: path, raw: (await zip.file(path).async("string")).slice(0, 450) });
  }
}
  function draw() {
  var list = Array.of(
    { id: "gen", lbl: "Метаданные (" + Object.keys(S.meta.gen).length + ")" },
    { id: "emb", lbl: "Шрифты и объекты (" + S.meta.emb.length + ")" },
    { id: "c2pa", lbl: "C2PA / ИИ " + (S.meta.c2pa ? "⚠️" : "") },
    { id: "sig", lbl: "Подписи (" + S.meta.sig.length + ")" }
  );
  $("tabs").innerHTML = list.map(function(t) {
    return "<button class='tab " + (S.tab === t.id ? "active" : "") + "' onclick=\"S.tab='" + t.id + "';draw()\">" + t.lbl + "</button>";
  }).join("");
  $("banner").innerHTML = "";
  $("add").style.display = S.tab === "gen" ? "inline-block" : "none";

  if (S.tab === "gen") {
    var html = Object.entries(S.meta.gen).map(function(pair) {
      var k = esc(pair.at(0)), v = esc(pair.at(1));
      return "<div class='row'>" +
        "<input value='" + k + "' readonly style='color:var(--muted)'>" +
        "<input value='" + v + "' onchange=\"updateField('" + k + "', this.value)\">" +
        "<button class='btn-del' onclick=\"deleteField('" + k + "')\">✕</button>" +
      "</div>";
    }).join("");
    $("fields").innerHTML = html || "<p style='color:var(--muted);font-size:13px;'>Метаданные отсутствуют или полностью очищены.</p>";
  } else if (S.tab === "emb") {
    $("fields").innerHTML = S.meta.emb.map(function(x) { return "<div class='note'>" + esc(x) + "</div>"; }).join("") || "<p style='color:var(--muted);font-size:13px;'>Встроенные шрифты, GPS и скрытые объекты не найдены.</p>";
  } else if (S.tab === "c2pa") {
    $("banner").innerHTML = "<div class='note'>Инструмент не проверяет подпись C2PA: данные отображаются так, как записаны в файле.</div>";
    $("fields").innerHTML = S.meta.c2pa
      ? "<textarea onchange='S.meta.c2pa.text=this.value'>" + esc(S.meta.c2pa.text) + "</textarea><button class='btn-red' onclick='S.meta.c2pa=null;draw()'>Удалить C2PA полностью</button>"
      : "<p style='color:var(--muted);font-size:13px;'>Метки C2PA / ИИ не обнаружены.</p>";
  } else {
    $("banner").innerHTML = "<div class='note'>После любых изменений цифровая подпись перестает быть действительной.</div>";
    $("fields").innerHTML = S.meta.sig.map(function(s, i) {
      return "<div class='box' style='margin-bottom:10px;background:var(--bg);'>" +
        "<div style='margin-bottom:6px;'><small>Подписант:</small><input value='" + esc(s.signer) + "' onchange='S.meta.sig.at(" + i + ").signer=this.value'></div>" +
        "<button class='btn-red' onclick='S.meta.sig.splice(" + i + ",1);draw()'>Удалить подпись</button></div>";
    }).join("") || "<p style='color:var(--muted);font-size:13px;'>Цифровые подписи не обнаружены.</p>";
  }
}

window.updateField = function(k, v) { S.meta.gen[k] = v; };
window.deleteField = function(k) { delete S.meta.gen[k]; draw(); };

$("add").onclick = function() {
  var k = prompt("Введите название поля (например: Author, Title, Creator, Software):");
  if (k) { S.meta.gen[k] = ""; draw(); }
};

$("purge").onclick = function() {
  S.meta.gen = {}; S.meta.c2pa = null; S.meta.sig = Array.of(); draw();
};

function cleanPdfOffline(buf) {
  var str = new TextDecoder("latin1").decode(new Uint8Array(buf));
  var tags = Array.of("/Producer", "/Creator", "/Author", "/Title", "/Subject", "/Keywords", "/CreationDate", "/ModDate");
  for (var i = 0; i < tags.length; i++) {
    var key = tags.at(i), pos = 0;
    while (true) {
      var idx = str.indexOf(key, pos);
      if (idx === -1) break;
      var p1 = str.indexOf("(", idx + key.length);
      var p2 = p1 !== -1 ? str.indexOf(")", p1 + 1) : -1;
      if (p1 !== -1 && p2 !== -1 && p1 - idx < 20) {
        var spaces = " ".repeat(p2 - p1 - 1);
        str = str.slice(0, p1 + 1) + spaces + str.slice(p2);
        pos = p2 + 1;
      } else {
        pos = idx + key.length;
      }
    }
  }
  var out = new Uint8Array(str.length);
  for (var j = 0; j < str.length; j++) out.set(Array.of(str.charCodeAt(j)), j);
  return new Blob(Array.of(out), { type: "application/pdf" });
}

async function quickClean(file) {
  var buf = await file.arrayBuffer();
  var ext = file.name.split(".").pop().toLowerCase();
  var bytes = new Uint8Array(buf);
  var blob;
  if (Array.of("jpg", "jpeg").includes(ext)) {
    var segs = parseJpegSegments(bytes).filter(function(s) { return s.marker < 0xE1 || s.marker > 0xEF; });
    blob = new Blob(Array.of(new Uint8Array(Array.of(0xFF, 0xD8))).concat(segs.map(function(s) { return s.raw; })), { type: "image/jpeg" });
  } else if (ext === "png") {
    var keep = extractPngChunks(buf, bytes).filter(function(c) { return !Array.of("tEXt", "iTXt", "zTXt", "eXIf", "tIME").includes(c.type); });
    blob = new Blob(Array.of(new Uint8Array(Array.of(0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A))).concat(keep.map(function(c) { return c.raw; })), { type: "image/png" });
  } else if (ext === "webp") {
    blob = buildWebpBlob(extractWebpChunks(buf, bytes).filter(function(c) { return !Array.of("EXIF", "XMP ", "ICCP").includes(c.type); }));
  } else if (ext === "pdf") {
    if (window.PDFLib) {
      var pdf = await PDFLib.PDFDocument.load(buf, { ignoreEncryption: true });
      var out = await PDFLib.PDFDocument.create();
      var pages = await out.copyPages(pdf, pdf.getPageIndices());
      pages.forEach(function(p) { out.addPage(p); });
      blob = new Blob(Array.of(await out.save()), { type: "application/pdf" });
    } else {
      blob = cleanPdfOffline(buf);
    }
  } else {
    blob = new Blob(Array.of(buf));
  }
  return Array.of("jpg", "jpeg", "png", "webp").includes(ext) ? await stripC2paBytes(blob) : blob;
}

$("save").onclick = async function() {
  var blob;
  if (Array.of("jpg", "jpeg").includes(S.ext)) {
    if (Object.keys(S.meta.gen).length === 0 || !window.piexif) {
      var segs = S.raw.jpgSegments.filter(function(s) { return s.marker < 0xE1 || s.marker > 0xEF; });
      blob = new Blob(Array.of(new Uint8Array(Array.of(0xFF, 0xD8))).concat(segs.map(function(s) { return s.raw; })), { type: "image/jpeg" });
    } else {
      var url = await toUrl(S.buf, "image/jpeg");
      var ex = S.raw.ex || { "0th": {}, "Exif": {}, "GPS": {}, "1st": {} };
      if (S.meta.gen.Artist || S.meta.gen.Author) ex["0th"][piexif.ImageIFD.Artist] = S.meta.gen.Artist || S.meta.gen.Author;
      if (S.meta.gen.Software) ex["0th"][piexif.ImageIFD.Software] = S.meta.gen.Software;
      url = piexif.insert(piexif.dump(ex), piexif.remove(url));
      blob = await (await fetch(url)).blob();
    }
  } else if (S.ext === "png") {
    var keep = S.raw.chunks.filter(function(c) { return !Array.of("tEXt", "iTXt", "zTXt", "eXIf", "tIME").includes(c.type); });
    blob = new Blob(Array.of(new Uint8Array(Array.of(0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A))).concat(keep.map(function(c) { return c.raw; })), { type: "image/png" });
  } else if (S.ext === "webp") {
    blob = buildWebpBlob(S.raw.chunks.filter(function(c) { return !Array.of("EXIF", "XMP ", "ICCP").includes(c.type); }));
  } else if (S.ext === "pdf") {
    if (window.PDFLib && S.raw.pdf) {
      var out = await PDFLib.PDFDocument.create();
      var pages = await out.copyPages(S.raw.pdf, S.raw.pdf.getPageIndices());
      pages.forEach(function(p) { out.addPage(p); });
      var g = S.meta.gen;
      if (g.Title) out.setTitle(g.Title);
      if (g.Author) out.setAuthor(g.Author);
      if (g.Creator) out.setCreator(g.Creator);
      if (g["PDF_Engine (Producer)"]) out.setProducer(g["PDF_Engine (Producer)"]);
      blob = new Blob(Array.of(await out.save()), { type: "application/pdf" });
    } else {
      blob = cleanPdfOffline(S.buf);
    }
  } else if (Array.of("docx", "xlsx", "pptx").includes(S.ext) && window.JSZip && S.raw.zip) {
    var zip = S.raw.zip;
    if (!S.meta.sig.length) Object.keys(zip.files).forEach(function(p) { if (p.startsWith("_xmlsignatures/")) zip.remove(p); });
    if (Object.keys(S.meta.gen).length === 0) {
      zip.remove("docProps/thumbnail.jpeg"); zip.remove("docProps/thumbnail.png"); zip.remove("docProps/custom.xml");
    }
    blob = await zip.generateAsync({ type: "blob" });
  } else {
    blob = new Blob(Array.of(S.buf));
  }
  if (S.meta.c2pa === null && Array.of("jpg", "jpeg", "png", "webp").includes(S.ext)) blob = await stripC2paBytes(blob);
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "clean_" + S.file.name;
  a.click();
};

function buildWebpBlob(chunks) {
  var body = new Blob(chunks.map(function(c) { return c.raw; }));
  var head = new Uint8Array(12);
  head.set(Array.of(0x52, 0x49, 0x46, 0x46), 0);
  new DataView(head.buffer).setUint32(4, 4 + body.size, true);
  head.set(Array.of(0x57, 0x45, 0x42, 0x50), 8);
  return new Blob(Array.of(head, body), { type: "image/webp" });
}

async function stripC2paBytes(blob) {
  var arr = new Uint8Array(await blob.arrayBuffer());
  var idx = new TextDecoder("latin1").decode(arr).indexOf("c2pa");
  if (idx !== -1) {
    arr.set(Array.of(0x00, 0x00, 0x00, 0x00), idx);
    return new Blob(Array.of(arr), { type: blob.type });
  }
  return blob;
}

function toUrl(b, m) {
  return new Promise(function(r) {
    var fr = new FileReader();
    fr.onload = function(e) { r(e.target.result); };
    fr.readAsDataURL(new Blob(Array.of(b), { type: m }));
  });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function(m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
  });
}
