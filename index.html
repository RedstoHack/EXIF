<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalMeta Pro — Редактор и очиститель метаданных</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --hover: #334155;
    --text: #f8fafc; --muted: #94a3b8; --blue: #3b82f6;
    --red: #ef4444; --green: #10b981; --border: #334155;
  }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { background: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; justify-content: center; }
  .wrap { max-width: 1060px; width: 100%; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 18px; }
  .badge { background: rgba(16,185,129,0.15); color: var(--green); padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
  .drop { border: 2px dashed var(--border); border-radius: 12px; padding: 38px 16px; text-align: center; background: var(--card); cursor: pointer; transition: 0.2s; }
  .drop:hover, .drop.drag { border-color: var(--blue); background: var(--hover); }
  .grid { display: none; grid-template-columns: 300px 1fr; gap: 18px; margin-top: 18px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .row { display: grid; grid-template-columns: 190px 1fr 34px; gap: 8px; margin-bottom: 8px; align-items: center; }
  input, textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; width: 100%; font-size: 13px; }
  textarea { min-height: 140px; font-family: monospace; resize: vertical; }
  button { cursor: pointer; border: none; border-radius: 6px; padding: 10px 14px; font-weight: 600; }
  .btn-blue { background: var(--blue); color: #fff; width: 100%; margin-top: 10px; }
  .btn-red { background: var(--red); color: #fff; width: 100%; margin-top: 10px; }
  .btn-del { background: rgba(239,68,68,0.2); color: var(--red); padding: 8px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 10px; flex-wrap: wrap; }
  .tab { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; font-size: 13px; }
  .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .note { background: rgba(245,158,11,0.15); border-left: 4px solid #f59e0b; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; border-radius: 4px; line-height: 1.4; }
  .prev img { max-width: 100%; max-height: 200px; object-fit: contain; border-radius: 6px; margin-top: 10px; border: 1px solid var(--border); background: #000; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; z-index: 99; }
  .modal-box { background: var(--card); padding: 24px; border-radius: 10px; max-width: 380px; width: 90%; border: 1px solid var(--border); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h2 style="margin:0;">LocalMeta Pro</h2>
      <small style="color:var(--muted)">exifr • piexifjs • pdf-lib • JSZip — 100% локально</small>
    </div>
    <div class="badge" id="libStatus">⏳ Загрузка библиотек...</div>
  </header>

  <div class="drop" id="drop">
    <h3 style="margin-top:0;">Перетащите файл сюда или нажмите для выбора</h3>
    <p style="color:var(--muted); margin-bottom:0; font-size:13px;">
      Поддержка: JPEG, PNG, WebP, TIFF, C2PA / Метки ИИ, PDF, DOCX, XLSX, PPTX
    </p>
    <input type="file" id="inp" hidden>
  </div>

  <div class="grid" id="work">
    <div class="box">
      <h4 style="margin-top:0;">Файл</h4>
      <div id="info" style="font-size:13px; color:var(--muted); line-height:1.6;"></div>
      <div class="prev" id="prev" style="margin-top:12px;"></div>
      <button class="btn-red" id="purge">🧹 Удалить ВСЕ метаданные</button>
      <button class="btn-blue" id="save">💾 Скачать готовый файл</button>
    </div>
    <div class="box">
      <div class="tabs" id="tabs"></div>
      <div id="banner"></div>
      <div id="fields"></div>
      <button class="tab" id="add" style="margin-top:12px;">+ Добавить поле</button>
    </div>
  </div>
</div>

<div class="modal" id="pwdModal">
  <div class="modal-box">
    <h3 style="margin-top:0;">Защищенный PDF</h3>
    <p style="font-size:13px; color:var(--muted);">Введите пароль для открытия (после сохранения защита будет снята):</p>
    <input type="password" id="pwdInput" placeholder="Пароль..." style="margin-bottom:14px;">
    <button class="btn-blue" id="pwdBtn">Открыть</button>
  </div>
</div>
<script>
var S = { file: null, buf: null, ext: "", tab: "gen", meta: { gen: {}, c2pa: null, sig: [], emb: [] }, raw: {} };
function $(id) { return document.getElementById(id); }

function loadScript(src) {
  return new Promise(function(resolve, reject) {
    var s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = function() { reject(new Error("Не удалось загрузить " + src)); };
    document.head.appendChild(s);
  });
}

Promise.all([
  loadScript("https://jsdelivr.net"),
  loadScript("https://cloudflare.com"),
  loadScript("https://unpkg.com"),
  loadScript("https://cloudflare.com")
]).then(function() {
  $("libStatus").textContent = "🔒 Библиотеки готовы (100% локально)";
}).catch(function(err) {
  $("libStatus").textContent = "⚠️ Ошибка сети при загрузке библиотек";
  $("libStatus").style.color = "#ef4444";
  alert(err.message);
});

$("drop").onclick = function() { $("inp").click(); };
$("drop").ondragover = function(e) { e.preventDefault(); $("drop").classList.add("drag"); };
$("drop").ondragleave = function() { $("drop").classList.remove("drag"); };
$("drop").ondrop = function(e) {
  e.preventDefault();
  $("drop").classList.remove("drag");
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
    handleFile(e.dataTransfer.files.item(0));
  }
};
$("inp").onchange = function(e) {
  if (e.target && e.target.files && e.target.files.length) {
    handleFile(e.target.files.item(0));
  }
};

async function handleFile(file) {
  if (!file) return;
  S.file = file;
  S.buf = await file.arrayBuffer();
  S.ext = file.name.split(".").pop().toLowerCase();
  S.meta = { gen: {}, c2pa: null, sig: [], emb: [] };
  S.raw = {};

  $("info").innerHTML = "<div><b>Имя:</b> " + esc(file.name) + "</div><div><b>Размер:</b> " + (file.size / 1024).toFixed(2) + " KB</div><div><b>Формат:</b> " + S.ext.toUpperCase() + "</div>";
  $("prev").innerHTML = "";

  var bytes = new Uint8Array(S.buf);
  detectC2PA(bytes);

  try {
    if (["jpg", "jpeg", "png", "webp", "tif", "tiff"].includes(S.ext)) {
      await parseImage(bytes);
    } else if (S.ext === "pdf") {
      await parsePDF(bytes, null);
    } else if (["docx", "xlsx", "pptx"].includes(S.ext)) {
      await parseOffice();
    } else {
      return alert("Формат ." + S.ext + " не поддерживается.");
    }
    $("work").style.display = "grid";
    draw();
  } catch (err) {
    console.error(err);
    alert("Ошибка при чтении файла: " + err.message);
  }
}

function detectC2PA(bytes) {
  var txt = new TextDecoder("latin1").decode(bytes);
  var idx = txt.indexOf("c2pa");
  if (idx === -1) return;
  var start = Math.max(0, idx - 64);
  var end = Math.min(bytes.length, idx + 8192);
  var sliceTxt = new TextDecoder("utf-8", { fatal: false }).decode(bytes.slice(start, end));
  var jsonBlocks = sliceTxt.match(/\{[^{}]*"(?:claim_generator|assertions|signature_info|alg|issuer|title|softwareAgent|actions|device)"[^{}]*\}/g);
  S.meta.c2pa = {
    text: jsonBlocks ? jsonBlocks.join("\n---\n") : sliceTxt.replace(/[^\x20-\x7E\u0400-\u04FF]/g, " ").replace(/\s{2,}/g, "\n")
  };
}

async function parseImage(bytes) {
  if (["jpg", "jpeg", "png", "webp"].includes(S.ext)) {
    var url = await toUrl(S.buf, "image/" + (S.ext === "jpg" ? "jpeg" : S.ext));
    $("prev").innerHTML = "<strong style='font-size:12px;'>Предпросмотр:</strong><br><img src='" + url + "'>";
  } else {
    $("prev").innerHTML = "<div class='note'>TIFF загружен для разбора метаданных.</div>";
  }

  // 1. Глубокий разбор через библиотеку exifr (EXIF, XMP, IPTC, ICC, GPS)
  if (window.exifr) {
    try {
      var parsed = await exifr.parse(S.buf, { xmp: true, iptc: true, icc: true, jfif: true, ihdr: true });
      if (parsed) {
        Object.entries(parsed).forEach(function(pair) {
          var k = pair.at(0), v = pair.at(1);
          if (v !== undefined && v !== null && !(v instanceof Uint8Array)) {
            S.meta.gen[k] = typeof v === "object" ? JSON.stringify(v) : String(v);
          }
        });
      }
    } catch (e) {}
  }

  // 2. Подготовка структур для сохранения без потери качества
  if (["jpg", "jpeg"].includes(S.ext) && window.piexif) {
    try {
      var jpegUrl = await toUrl(S.buf, "image/jpeg");
      S.raw.ex = piexif.load(jpegUrl);
    } catch (e) {
      S.raw.ex = { "0th": {}, "Exif": {}, "GPS": {}, "1st": {} };
    }
  } else if (S.ext === "png") {
    var view = new DataView(S.buf), o = 8;
    S.raw.chunks = [];
    while (o < view.byteLength) {
      var len = view.getUint32(o);
      var type = String.fromCharCode.apply(null, bytes.slice(o + 4, o + 8));
      var data = bytes.slice(o + 8, o + 8 + len);
      S.raw.chunks.push({ type: type, raw: bytes.slice(o, o + 12 + len), data: data });
      if (["tEXt", "iTXt", "zTXt", "eXIf", "tIME"].includes(type)) {
        S.meta.gen["PNG_" + type + "_" + o] = new TextDecoder("utf-8", { fatal: false }).decode(data).replace(/\0/g, ": ");
      }
      o += 12 + len;
    }
  } else if (S.ext === "webp") {
    var wView = new DataView(S.buf), wo = 12;
    S.raw.chunks = [];
    while (wo < wView.byteLength) {
      var wType = String.fromCharCode.apply(null, bytes.slice(wo, wo + 4));
      var wLen = wView.getUint32(wo + 4, true);
      var pad = wLen + (wLen % 2);
      S.raw.chunks.push({ type: wType, raw: bytes.slice(wo, wo + 8 + pad) });
      wo += 8 + pad;
    }
  }
}

async function parsePDF(bytes, password) {
  try {
    var opts = { ignoreEncryption: true };
    if (password) opts.password = password;
    var pdf = await PDFLib.PDFDocument.load(S.buf, opts);
    S.raw.pdf = pdf;
    S.meta.gen = {
      Title: pdf.getTitle() || "", Author: pdf.getAuthor() || "", Subject: pdf.getSubject() || "",
      Keywords: pdf.getKeywords() || "", Creator: pdf.getCreator() || "", Producer: pdf.getProducer() || "",
      CreationDate: pdf.getCreationDate() ? pdf.getCreationDate().toISOString() : "",
      ModificationDate: pdf.getModificationDate() ? pdf.getModificationDate().toISOString() : ""
    };
    var rawStr = new TextDecoder("latin1").decode(bytes);
    var eofCount = (rawStr.match(/%%EOF/g) || []).length;
    if (eofCount > 1) S.meta.emb.push("Найдено " + eofCount + " инкрементальных версий документа (будут удалены при сохранении).");
    var xmp = rawStr.match(/<x:xmpmeta[\s\S]*?<\/x:xmpmeta>/);
    if (xmp) S.meta.gen["XMP_Metadata"] = xmp.at(0);
    var sigs = rawStr.match(/\/Type\s*\/Sig[\s\S]{0,600}/g) || [];
    sigs.forEach(function(s, i) {
      var m = s.match(/\/Name\s*\(([^)]+)\)/);
      var signer = (m && m.at(1)) || ("Подпись PDF #" + (i + 1));
      S.meta.sig.push({ signer: signer, raw: s.slice(0, 400) });
    });
    var fonts = Array.from(new Set(rawStr.match(/\/BaseFont\s*\/([A-Za-z0-9+\-]+)/g) || []));
    if (fonts.length) S.meta.emb.push("Шрифты: " + fonts.map(function(f) { return f.replace("/BaseFont", "").trim(); }).join(", "));
    $("prev").innerHTML = "<div class='note'>PDF (" + pdf.getPageCount() + " стр.). Ограничения сняты автоматически.</div>";
  } catch (e) {
    if (e.message.toLowerCase().includes("password") || e.message.toLowerCase().includes("encrypted")) $("pwdModal").style.display = "flex";
    else throw e;
  }
}

$("pwdBtn").onclick = async function() {
  var pwd = $("pwdInput").value;
  $("pwdModal").style.display = "none";
  await parsePDF(new Uint8Array(S.buf), pwd);
  $("work").style.display = "grid";
  draw();
};

async function parseOffice() {
  var zip = await JSZip.loadAsync(S.buf);
  S.raw.zip = zip;
  var parser = new DOMParser();
  for (var xmlPath of ["docProps/core.xml", "docProps/app.xml", "docProps/custom.xml"]) {
    if (zip.file(xmlPath)) {
      var doc = parser.parseFromString(await zip.file(xmlPath).async("string"), "application/xml");
      Array.from(doc.documentElement.children).forEach(function(n) {
        S.meta.gen[xmlPath.split("/").pop() + ":" + n.nodeName] = n.textContent;
      });
    }
  }
  for (var path of Object.keys(zip.files)) {
    if (path.endsWith(".rels") || path.includes("settings.xml") || path.includes("printerSettings")) {
      var paths = (await zip.file(path).async("string")).match(/[A-Za-z]:\\[^"<]+|\\\\[^"<]+/g);
      if (paths) S.meta.gen["Path_" + path] = paths.join("; ");
    }
    if (path.includes("thumbnail")) {
      $("prev").innerHTML = "<strong style='font-size:12px;'>Миниатюра документа:</strong><br><img src='" + URL.createObjectURL(await zip.file(path).async("blob")) + "'>";
    }
    if (path.match(/media\/.*\.(jpg|jpeg|png|webp)$/i)) S.meta.emb.push("Встроенное фото: " + path + " (EXIF будет очищен)");
    if (path.startsWith("_xmlsignatures/")) {
      var sigXml = await zip.file(path).async("string");
      var mSubj = sigXml.match(/<X509SubjectName>([^<]+)<\/X509SubjectName>/);
      S.meta.sig.push({ signer: (mSubj && mSubj.at(1)) || path, raw: sigXml.slice(0, 450) });
    }
  }
}
  function draw() {
  var list = [
    { id: "gen", lbl: "Основные (" + Object.keys(S.meta.gen).length + ")" },
    { id: "c2pa", lbl: "C2PA / ИИ " + (S.meta.c2pa ? "⚠️" : "") },
    { id: "sig", lbl: "Подписи (" + S.meta.sig.length + ")" },
    { id: "emb", lbl: "Встроенное (" + S.meta.emb.length + ")" }
  ];
  $("tabs").innerHTML = list.map(function(t) {
    return "<button class='tab " + (S.tab === t.id ? "active" : "") + "' onclick=\"S.tab='" + t.id + "';draw()\">" + t.lbl + "</button>";
  }).join("");
  $("banner").innerHTML = "";
  $("add").style.display = S.tab === "gen" ? "inline-block" : "none";

  if (S.tab === "gen") {
    var html = Object.entries(S.meta.gen).map(function(pair) {
      var rawKey = pair.at(0);
      var k = esc(rawKey), v = esc(pair.at(1));
      return "<div class='row'>" +
        "<input value='" + k + "' readonly style='color:var(--muted)'>" +
        "<input value='" + v + "' onchange=\"updateField('" + k + "', this.value)\">" +
        "<button class='btn-del' onclick=\"deleteField('" + k + "')\">✕</button>" +
      "</div>";
    }).join("");
    $("fields").innerHTML = html || "<p style='color:var(--muted);font-size:13px;'>Метаданные отсутствуют или полностью очищены.</p>";
  } else if (S.tab === "c2pa") {
    $("banner").innerHTML = "<div class='note'>Инструмент не проверяет подпись C2PA: данные отображаются так, как записаны в файле. Вы можете отредактировать или удалить весь блок.</div>";
    $("fields").innerHTML = S.meta.c2pa
      ? "<textarea onchange='S.meta.c2pa.text=this.value'>" + esc(S.meta.c2pa.text) + "</textarea><button class='btn-red' onclick='S.meta.c2pa=null;draw()'>Удалить C2PA полностью</button>"
      : "<p style='color:var(--muted);font-size:13px;'>Учетные данные C2PA / метки ИИ не обнаружены.</p>";
  } else if (S.tab === "sig") {
    $("banner").innerHTML = "<div class='note'>Инструмент не проверяет подпись: любое имя может написать кто угодно. После любых изменений подпись перестает быть действительной.</div>";
    $("fields").innerHTML = S.meta.sig.map(function(s, i) {
      return "<div class='box' style='margin-bottom:10px;background:var(--bg);'>" +
        "<div style='margin-bottom:6px;'><small>Подписант:</small><input value='" + esc(s.signer) + "' onchange='S.meta.sig.at(" + i + ").signer=this.value'></div>" +
        "<div style='margin-bottom:6px;'><small>Сертификат / Данные:</small><textarea onchange='S.meta.sig.at(" + i + ").raw=this.value'>" + esc(s.raw) + "</textarea></div>" +
        "<button class='btn-red' onclick='S.meta.sig.splice(" + i + ",1);draw()'>Удалить подпись</button></div>";
    }).join("") || "<p style='color:var(--muted);font-size:13px;'>Цифровые подписи не обнаружены.</p>";
  } else {
    $("fields").innerHTML = S.meta.emb.map(function(x) { return "<div class='note'>" + esc(x) + "</div>"; }).join("") || "<p style='color:var(--muted);font-size:13px;'>Встроенные объекты не найдены.</p>";
  }
}

window.updateField = function(key, val) { S.meta.gen[key] = val; };
window.deleteField = function(key) { delete S.meta.gen[key]; draw(); };

$("add").onclick = function() {
  var k = prompt("Введите название поля (например: Author, Title, Software, Artist):");
  if (k) { S.meta.gen[k] = ""; draw(); }
};

$("purge").onclick = function() {
  S.meta.gen = {}; S.meta.c2pa = null; S.meta.sig = []; draw();
};

$("save").onclick = async function() {
  var blob;
  if (["jpg", "jpeg"].includes(S.ext)) {
    var url = await toUrl(S.buf, "image/jpeg");
    if (Object.keys(S.meta.gen).length === 0) {
      url = piexif.remove(url);
    } else {
      var ex = S.raw.ex || { "0th": {}, "Exif": {}, "GPS": {}, "1st": {} };
      if (S.meta.gen.Artist || S.meta.gen.Author) ex["0th"][piexif.ImageIFD.Artist] = S.meta.gen.Artist || S.meta.gen.Author;
      if (S.meta.gen.Software) ex["0th"][piexif.ImageIFD.Software] = S.meta.gen.Software;
      if (S.meta.gen.Make) ex["0th"][piexif.ImageIFD.Make] = S.meta.gen.Make;
      if (S.meta.gen.Model) ex["0th"][piexif.ImageIFD.Model] = S.meta.gen.Model;
      if (S.meta.gen.Copyright) ex["0th"][piexif.ImageIFD.Copyright] = S.meta.gen.Copyright;
      url = piexif.insert(piexif.dump(ex), piexif.remove(url));
    }
    blob = await (await fetch(url)).blob();
  } else if (S.ext === "png") {
    var metaTypes = ["tEXt", "iTXt", "zTXt", "eXIf", "tIME"];
    var keep = S.raw.chunks.filter(function(c) { return !metaTypes.includes(c.type); });
    var iendIdx = keep.findIndex(function(c) { return c.type === "IEND"; });
    var customChunks = [];
    Object.entries(S.meta.gen).forEach(function(p) {
      var k = p.at(0), v = p.at(1);
      if (!k.startsWith("PNG_")) customChunks.push(buildPngTextChunk(k, v));
    });
    if (iendIdx !== -1) Array.prototype.splice.apply(keep, [iendIdx, 0].concat(customChunks));
    var pngSig = new Uint8Array([0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A]);
    blob = new Blob([pngSig].concat(keep.map(function(c) { return c.raw; })), { type: "image/png" });
  } else if (S.ext === "webp") {
    var keepW = S.raw.chunks.filter(function(c) { return !["EXIF", "XMP ", "ICCP"].includes(c.type); });
    var body = new Blob(keepW.map(function(c) { return c.raw; }));
    var head = new Uint8Array(12);
    head.set([0x52, 0x49, 0x46, 0x46], 0);
    new DataView(head.buffer).setUint32(4, 4 + body.size, true);
    head.set([0x57, 0x45, 0x42, 0x50], 8);
    blob = new Blob([head, body], { type: "image/webp" });
  } else if (S.ext === "pdf") {
    var out = await PDFLib.PDFDocument.create();
    var pages = await out.copyPages(S.raw.pdf, S.raw.pdf.getPageIndices());
    pages.forEach(function(p) { out.addPage(p); });
    var g = S.meta.gen;
    if (g.Title) out.setTitle(g.Title);
    if (g.Author) out.setAuthor(g.Author);
    if (g.Subject) out.setSubject(g.Subject);
    if (g.Keywords) out.setKeywords(g.Keywords.split(",").map(function(s) { return s.trim(); }));
    if (g.Creator) out.setCreator(g.Creator);
    if (g.Producer) out.setProducer(g.Producer);
    blob = new Blob([await out.save()], { type: "application/pdf" });
  } else if (["docx", "xlsx", "pptx"].includes(S.ext)) {
    var zip = S.raw.zip;
    if (!S.meta.sig.length) Object.keys(zip.files).forEach(function(p) { if (p.startsWith("_xmlsignatures/")) zip.remove(p); });
    if (Object.keys(S.meta.gen).length === 0) {
      zip.remove("docProps/thumbnail.jpeg"); zip.remove("docProps/thumbnail.png"); zip.remove("docProps/custom.xml");
    }
    for (var p of Object.keys(zip.files)) {
      if (p.match(/media\/.*\.(jpg|jpeg)$/i)) {
        var b64 = await zip.file(p).async("base64");
        var clean = piexif.remove("data:image/jpeg;base64," + b64);
        zip.file(p, clean.split(",").at(1), { base64: true });
      }
    }
    if (zip.file("docProps/core.xml")) {
      var g = S.meta.gen;
      var coreXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<cp:coreProperties xmlns:cp="http://openxmlformats.org" xmlns:dc="http://purl.org">' +
        '<dc:title>' + esc(g["core.xml:dc:title"] || g.Title || "") + '</dc:title>' +
        '<dc:creator>' + esc(g["core.xml:dc:creator"] || g.Author || "") + '</dc:creator>' +
        '<cp:lastModifiedBy>' + esc(g["core.xml:cp:lastModifiedBy"] || "") + '</cp:lastModifiedBy></cp:coreProperties>';
      zip.file("docProps/core.xml", coreXml);
    }
    blob = await zip.generateAsync({ type: "blob" });
  } else {
    blob = new Blob([S.buf]);
  }

  if (S.meta.c2pa === null && ["jpg", "jpeg", "png", "webp"].includes(S.ext)) {
    var arr = new Uint8Array(await blob.arrayBuffer());
    var str = new TextDecoder("latin1").decode(arr);
    var idx = str.indexOf("c2pa");
    if (idx !== -1) {
      arr.set([0x00, 0x00, 0x00, 0x00], idx);
      blob = new Blob([arr], { type: blob.type });
    }
  }

  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "clean_" + S.file.name;
  a.click();
};

function buildPngTextChunk(key, val) {
  var data = new TextEncoder().encode(key + "\0" + val);
  var chunk = new Uint8Array(12 + data.length);
  new DataView(chunk.buffer).setUint32(0, data.length);
  chunk.set([0x74, 0x45, 0x58, 0x74], 4);
  chunk.set(data, 8);
  return { type: "tEXt", raw: chunk };
}

function toUrl(b, m) {
  return new Promise(function(r) {
    var fr = new FileReader();
    fr.onload = function(e) { r(e.target.result); };
    fr.readAsDataURL(new Blob([b], { type: m }));
  });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function(m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
  });
}
</script>
